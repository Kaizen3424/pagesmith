# MyCMS workspace (pnpm 10) — AGENTS.md §6 mirrors the commands that act on this file.
packages:
  - packages/*
  - playground
  - e2e

# Exact catalog pins (renovate keeps them current; ADR-0010 §2 pins + supply-chain law).
catalog:
  typescript: 7.0.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 22.20.5
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@biomejs/biome": 2.6.3
  tsup: 9.0.0
  "@playwright/test": 1.64.1
  zod: 4.6.7
  fast-check: 4.10.2
  idb-keyval: 6.3.0
  msw: 3.0.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-query": 5.105.0
  react-hook-form: 7.91.0
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  yaml: 2.9.1
  "@changesets/cli": 3.0.3
  "@radix-ui/react-slot": 1.5.0
  "@radix-ui/react-dialog": 1.3.1
  "@radix-ui/react-label": 2.1.17
  "@radix-ui/react-tooltip": 1.4.1
  "@radix-ui/react-popover": 1.3.1
  "@radix-ui/react-dropdown-menu": 2.2.1
  "@radix-ui/react-checkbox": 1.4.1
  "@radix-ui/react-switch": 1.4.1
  "@radix-ui/react-select": 2.4.1

# Fail installs on engine drift (Node 22 pin law, ADR-0010 §5).
engine-strict: true

# Committed postinstall-allowlist (P0.3 — accept-by-run list with per-entry reason).
# NEVER add: playwright (browsers land via an explicit `playwright install chromium`),
# shiki, SWC, or anything without a runbook reason (AGENTS.md §4 "Ask first").
onlyBuiltDependencies:
  # esbuild — its postinstall materializes the platform JS binary (used by tsup/vite builds)
  - esbuild
  # lightningcss — napi binary setup for the Tailwind v4 toolchain
  - lightningcss
  # @tailwindcss/oxide — native oxide scanner binaries for Tailwind v4
  - "@tailwindcss/oxide"
